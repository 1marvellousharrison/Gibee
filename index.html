<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ChatApp"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"/>
  <title>Sign In — ChatApp</title>
  <meta name="description" content="Sign in to ChatApp — the fast, private messaging platform."/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="page-shell">
  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 10H6v-2h12v2zm0-4H6V6h12v2z"/></svg>
      </div>
      <h1>ChatApp</h1>
      <p>Welcome back — sign in to continue</p>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>

      <!-- Identifier -->
      <div class="form-group">
        <label class="form-label" for="identifier">Email or Username</label>
        <input class="input-field" id="identifier" type="text"
               placeholder="you@example.com or username"
               autocomplete="email" autocapitalize="off" spellcheck="false"
               aria-label="Email or username" aria-describedby="identifierMsg"/>
        <div class="field-msg" id="identifierMsg" role="alert" aria-live="polite"></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:7px;">
          <label class="form-label" for="passwordInput" style="margin-bottom:0">Password</label>
          <button type="button" class="resend-btn" id="forgotBtn" style="font-size:0.78rem">Forgot password?</button>
        </div>
        <div class="password-wrap">
          <input class="input-field" id="passwordInput" type="password"
                 placeholder="Enter your password"
                 autocomplete="current-password"
                 aria-label="Password" aria-describedby="passwordMsg"/>
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="field-msg" id="passwordMsg" role="alert" aria-live="polite"></div>
      </div>

      <!-- Remember me -->
      <div class="remember-row">
        <label class="toggle-switch" for="rememberMe">
          <input type="checkbox" id="rememberMe" aria-label="Remember me"/>
          <span class="toggle-track"></span>
        </label>
        <label class="remember-label" for="rememberMe">Remember me on this device</label>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-primary" id="loginBtn" disabled>
        <span class="btn-text">Sign In</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <!-- Divider -->
    <div class="divider"><span>or continue with</span></div>

    <!-- Social -->
    <div class="social-row">
      <button class="btn-secondary" id="googleBtn" type="button" aria-label="Continue with Google">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Google
      </button>
      <button class="btn-secondary" id="appleBtn" type="button" aria-label="Continue with Apple">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--soft-light)">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.39.07 2.35.74 3.17.8 1.2-.26 2.37-1 3.66-.85 1.54.2 2.7.89 3.44 2.21-3.12 1.89-2.37 6.09.72 7.22-.38.97-.84 1.92-1.99 3.5zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Apple
      </button>
    </div>

    <div class="card-footer">
      Don't have an account? <a href="signup.html" id="signupLink">Create one</a>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  // Redirect if already logged in
  if (Session.isLoggedIn()) window.location.href = 'chat.html';

  const identifierInput = document.getElementById('identifier');
  const passwordInput   = document.getElementById('passwordInput');
  const loginBtn        = document.getElementById('loginBtn');
  const identifierMsg   = document.getElementById('identifierMsg');
  const passwordMsg     = document.getElementById('passwordMsg');

  // Auto-focus
  identifierInput.focus();

  // -- Real-time validation --------------------------------
  function checkForm() {
    const idOk  = Validate.identifier(identifierInput.value.trim());
    const pwOk  = Validate.password(passwordInput.value);
    loginBtn.disabled = !(idOk && pwOk);
  }

  identifierInput.addEventListener('input', () => {
    checkForm();
    if (identifierInput.value.length > 2) {
      const ok = Validate.identifier(identifierInput.value.trim());
      setFieldState(identifierInput, identifierMsg, ok ? '' : 'error', ok ? '' : 'Enter a valid email or username');
    } else {
      setFieldState(identifierInput, identifierMsg, '', '');
    }
  });

  passwordInput.addEventListener('input', () => {
    checkForm();
    if (passwordInput.value.length > 0 && !Validate.password(passwordInput.value)) {
      setFieldState(passwordInput, passwordMsg, 'error', 'Password must be at least 6 characters');
    } else {
      setFieldState(passwordInput, passwordMsg, '', '');
    }
  });

  // -- Show / hide password --------------------------------
  document.getElementById('pwdToggle').addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    document.getElementById('eyeIcon').style.display    = isPassword ? 'none'  : 'block';
    document.getElementById('eyeOffIcon').style.display = isPassword ? 'block' : 'none';
  });

  // -- Form submit -----------------------------------------
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const identifier = identifierInput.value.trim();
    const password   = passwordInput.value;
    setLoading(loginBtn, true);
    setFormDisabled(document.getElementById('loginForm'), true);
    try {
      const result = await API.login(identifier, password);
Session.set('access_token', result.access_token);
      Session.set('user', result.user);
      if (document.getElementById('rememberMe').checked) Session.persist();
      showToast('Welcome back! \uD83C\uDF89', 'success', 1800);
      setTimeout(() => window.location.href = 'chat.html', 1400);
    } catch (err) {
      showToast(err.message, 'error');
      setFieldState(passwordInput, passwordMsg, 'error', err.message);
      setLoading(loginBtn, false);
      setFormDisabled(document.getElementById('loginForm'), false);
      passwordInput.focus(); passwordInput.select();
    }
  });

  // -- Keyboard shortcuts ----------------------------------
  identifierInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); passwordInput.focus(); } });
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !loginBtn.disabled) { e.preventDefault(); loginBtn.click(); } });

  // -- OAuth -----------------------------------------------
  async function handleOAuth(provider) {
    showToast(`Connecting to ${provider}…`, 'info', 2000);
    try {
      const result = await API.oauthLogin(provider);
      Session.set('access_token', result.access_token);
      Session.set('user', result.user);
      showToast('Signed in! \uD83C\uDF89', 'success', 1500);
      setTimeout(() => window.location.href = 'chat.html', 1200);
    } catch(err) { showToast(err.message, 'error'); }
  }
  document.getElementById('googleBtn').addEventListener('click', () => handleOAuth('Google'));
  document.getElementById('appleBtn').addEventListener('click', () => handleOAuth('Apple'));

  // -- Forgot password -------------------------------------
  document.getElementById('forgotBtn').addEventListener('click', () => {
    showToast('A password reset link will be sent to your email.', 'info', 3500);
  });
</script>
</body>
</html>
