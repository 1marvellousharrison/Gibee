<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="ChatApp"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"/>
  <title>Enter Password — ChatApp</title>
  <meta name="description" content="Enter your password to sign in to ChatApp."/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="page-shell">
  <div class="card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 2H4a2 2 0 00-2 2v18l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2zm-2 10H6v-2h12v2zm0-4H6V6h12v2z"/>
        </svg>
      </div>
      <h1>ChatApp</h1>
      <p>Welcome back</p>
    </div>

    <!-- Step indicator -->
    <div class="step-indicator" aria-label="Step 2 of 2">
      <div class="step-dot done"></div>
      <div class="step-dot active"></div>
    </div>

    <!-- Back -->
    <button class="back-btn" id="backBtn" aria-label="Go back to identifier entry">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5l-5 5 5 5"/>
      </svg>
      Change account
    </button>

    <div class="section-title">Enter your password</div>
    <p class="section-sub" id="identifierDisplay">Signing in as your account.</p>

    <form id="passwordForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="passwordInput">Password</label>
        <div class="password-wrap">
          <input class="input-field" id="passwordInput" type="password"
                 placeholder="Enter your password"
                 autocomplete="current-password"
                 aria-label="Password" aria-describedby="passwordMsg"/>
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show password">
            <!-- Eye icon (show) -->
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye-off icon (hide) -->
            <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
        <div class="field-msg" id="passwordMsg" role="alert" aria-live="polite"></div>
      </div>

      <div class="remember-row">
        <label class="toggle-switch" for="rememberPwd">
          <input type="checkbox" id="rememberPwd" aria-label="Remember me"/>
          <span class="toggle-track"></span>
        </label>
        <label class="remember-label" for="rememberPwd">Remember me on this device</label>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn" disabled>
        <span class="btn-text">Sign In</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </form>

    <div class="divider"><span>or</span></div>
    <button class="btn-secondary" id="forgotBtn">Forgot password?</button>

    <div class="card-footer" style="margin-top: 16px;">
      Use a different method? <a href="index.html">Go back</a>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  // Guard
  if (!Session.get('identifier')) window.location.href = 'index.html';
  if (Session.isLoggedIn()) window.location.href = 'chat.html';

  // Show identifier
  const identifier = Session.get('identifier') || '';
  document.getElementById('identifierDisplay').textContent = `Signing in as ${identifier}`;

  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const passwordMsg = document.getElementById('passwordMsg');
  const pwdToggle = document.getElementById('pwdToggle');
  const eyeIcon = document.getElementById('eyeIcon');
  const eyeOffIcon = document.getElementById('eyeOffIcon');

  // Auto-focus
  passwordInput.focus();

  // -- Show/hide password toggle -------------------------
  pwdToggle.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    eyeIcon.style.display = isPassword ? 'none' : 'block';
    eyeOffIcon.style.display = isPassword ? 'block' : 'none';
    pwdToggle.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
  });

  // -- Real-time validation ------------------------------
  passwordInput.addEventListener('input', () => {
    const valid = Validate.password(passwordInput.value);
    loginBtn.disabled = !valid;
    if (passwordInput.value.length > 0) {
      setFieldState(passwordInput, passwordMsg, valid ? '' : 'error', valid ? '' : 'Password must be at least 6 characters');
    } else {
      setFieldState(passwordInput, passwordMsg, '', '');
    }
  });

  // -- Form Submit ---------------------------------------
  document.getElementById('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = passwordInput.value;
    if (!Validate.password(password)) { showToast('Please enter your password.', 'error'); return; }
    setLoading(loginBtn, true);
    setFormDisabled(document.getElementById('passwordForm'), true);
    try {
      const result = await API.login(identifier, password);
      Session.set('access_token', result.access_token);
      Session.set('user', result.user);
      if (document.getElementById('rememberPwd').checked) {
        Session.persist();
      }
      showToast('Welcome back! \uD83C\uDF89', 'success', 1800);
      setTimeout(() => window.location.href = 'chat.html', 1500);
    } catch (err) {
      showToast(err.message, 'error');
      setFieldState(passwordInput, passwordMsg, 'error', err.message);
      setLoading(loginBtn, false);
      setFormDisabled(document.getElementById('passwordForm'), false);
      passwordInput.focus();
      passwordInput.select();
    }
  });

  // -- Forgot password -----------------------------------
  document.getElementById('forgotBtn').addEventListener('click', () => {
    showToast('Password reset link sent to your email.', 'info', 3000);
  });

  // -- Back ----------------------------------------------
  document.getElementById('backBtn').addEventListener('click', () => {
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
