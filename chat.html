<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Gibee"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"/>
  <title>Gibee — Messages</title>
  <meta name="description" content="Your Gibee messages. Start chatting now."/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* -- Chat Shell --------------------------- */
    body { background: var(--bg-black); overflow: hidden; }

    :root {
      --motion-smooth: 200ms cubic-bezier(.25,.1,.25,1);
      --motion-spring: 420ms cubic-bezier(.2,.8,.2,1);
      --motion-bounce: 360ms cubic-bezier(.22,1.45,.36,1);
      /* measured at runtime so the popovers clear notches/safe areas */
      --topbar-h: 72px;
      /* how much of the composer the on-screen keyboard is sitting on top of */
      --kb-inset: 0px;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: 72px 320px minmax(0, 1fr) 300px;
      flex: 1;
      min-height: 0;
      background: var(--bg-black);
      animation: pageFade var(--motion-spring) both;
    }

    .chat-main-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Clickable chat header profile (opens the user profile page) */
    .chat-header-profile {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
      background: none;
      border: none;
      padding: 4px;
      margin: -4px;
      border-radius: 12px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: inherit;
      transition: background var(--motion-smooth);
    }
    .chat-header-profile:hover { background: var(--overlay); }
    .chat-header-profile:focus-visible { outline: 2px solid var(--primary-purple); outline-offset: 2px; }
    .chat-header-profile .chat-header-info { flex: 1; min-width: 0; }

    .header-back { display: none; flex-shrink: 0; }

    @keyframes pageFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes messagePop {
      0% { opacity: 0; transform: translateY(12px) scale(.92); }
      70% { opacity: 1; transform: translateY(-1px) scale(1.015); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes badgePop {
      0% { opacity: 0; transform: scale(0); }
      72% { opacity: 1; transform: scale(1.16); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes typingWave {
      from { transform: translateY(0); opacity: .55; }
      to { transform: translateY(-60%); opacity: 1; }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 4px 12px rgba(124,58,237,.4); }
      50% { box-shadow: 0 8px 24px rgba(168,85,247,.72); }
    }

    .nav-rail {
      background: #0a0315;
      border-right: 1px solid rgba(196,181,253,.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 10px;
      gap: 14px;
    }

    .rail-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(124,58,237,.35);
    }
    .rail-logo svg { width: 22px; height: 22px; fill: #fff; }

    .rail-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      align-items: center;
    }

    .rail-spacer { flex: 1; }

    .rail-profile {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(196,181,253,.25);
      background: rgba(124,58,237,.16);
      color: var(--soft-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 800;
    }

    /* -- Sidebar ------------------------------ */
    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid rgba(196,181,253,.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(196,181,253,.08);
      flex-shrink: 0;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--soft-light);
    }

    .sidebar-brand .icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .sidebar-brand .icon svg { width: 18px; height: 18px; fill: #fff; }

    .sidebar-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--overlay); border: 1px solid rgba(196,181,253,.12);
      color: var(--light-purple); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--motion-smooth), color var(--motion-smooth), transform var(--motion-smooth), box-shadow var(--motion-smooth);
    }
    .icon-btn:hover { background: var(--primary-purple); color: #fff; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(124,58,237,.28); }
    .icon-btn:active { transform: scale(.96); }
    .icon-btn svg { width: 16px; height: 16px; }

/* Search */
    .sidebar-search {
      padding: 10px 16px 8px;
      flex-shrink: 0;
    }
    .sidebar-search input {
      width: 100%; height: 48px;
      background: var(--bg-surface);
      border: none;
      border-radius: 16px;
      color: var(--soft-light);
      font-size: 0.9rem; font-family: inherit;
      padding: 0 16px; outline: none;
      box-shadow: var(--neu-inset);
    }
    .sidebar-search input::placeholder { color: rgba(196,181,253,.5); }
    [data-theme="light"] .sidebar-search input::placeholder { color: rgba(91,33,182,.45); }
    .sidebar-search input:focus { box-shadow: var(--neu-inset), 0 0 0 2px rgba(124,58,237,.3); }

    /* Archive reassurance: shows only while the archive screen is open */
    .archive-note {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      flex-shrink: 0;
      margin: 0 16px 2px;
      padding: 8px 11px;
      border-radius: 12px;
      background: rgba(124,58,237,.1);
      border: 1px solid rgba(196,181,253,.12);
      color: rgba(196,181,253,.72);
      font-size: .68rem;
      font-weight: 600;
      line-height: 1.42;
    }
    .archive-note[hidden] { display: none; }
    .archive-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 1px; }
    [data-theme="light"] .archive-note {
      background: rgba(124,58,237,.06);
      border-color: rgba(91,33,182,.1);
      color: rgba(91,33,182,.72);
    }

    /* Tabs */
    .sidebar-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 12px;
      flex-shrink: 0;
    }
    /* The archive is a browse screen, so the filter pills step aside and the
       encryption note gets the space directly under the search box. */
    .sidebar-tabs[hidden] { display: none; }
    .sidebar-tabs-scroll {
      display: flex;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sidebar-tabs-scroll::-webkit-scrollbar { display: none; }
    .s-tab {
      padding: 6px 7px; border-radius: 20px;
      border: 1px solid rgba(196,181,253,.18);
      background: var(--bg-surface);
      box-shadow: var(--neu-tile);
      color: rgba(196,181,253,.75);
      font-size: 0.79rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: all 0.18s;
      white-space: nowrap; flex-shrink: 0;
    }
    .s-tab.active {
      background: var(--primary-purple);
      border-color: var(--primary-purple);
      color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,.45);
    }
    .s-tab:hover:not(.active) { border-color: rgba(124,58,237,.5); color: var(--soft-light); }
    .s-tab:active { transform: scale(.96); }
    /* New chat, pinned to the right of the filter pills */
    .s-tab-add {
      width: 36px; height: 36px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(196,181,253,.22);
      border-radius: 50%;
      background: var(--bg-surface);
      box-shadow: var(--neu-tile);
      color: var(--light-purple);
      cursor: pointer;
      transition: transform var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }
    .s-tab-add svg { width: 18px; height: 18px; }
    .s-tab-add:hover { border-color: var(--primary-purple); color: var(--primary-purple); }
    .s-tab-add:active { transform: scale(.9); }
    [data-theme="light"] .s-tab { border-color: rgba(91,33,182,.18); color: rgba(91,33,182,.78); }
    [data-theme="light"] .s-tab:hover:not(.active) { border-color: var(--primary-purple); color: var(--primary-purple); }
    [data-theme="light"] .s-tab-add { border-color: rgba(91,33,182,.22); color: var(--primary-purple); }

/* Conversation List */
    .conv-list { overflow-y: auto; flex: 1; padding: 6px 0 12px; }
    .conv-list::-webkit-scrollbar { width: 4px; }
    .conv-list::-webkit-scrollbar-thumb { background: rgba(196,181,253,.15); border-radius: 2px; }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 12px 9px;
      padding: 12px 14px;
      cursor: pointer;
      background: var(--bg-surface);
      border-radius: 16px;
      box-shadow: var(--neu-tile);
      transition: background var(--motion-smooth), transform var(--motion-smooth), box-shadow var(--motion-smooth);
    }
    .conv-item:hover, .conv-item:focus-visible { background: var(--overlay); transform: translateY(-2px); box-shadow: var(--neu-shadow); outline: none; }
    .conv-item.active { background: rgba(124,58,237,.16); box-shadow: inset 0 0 0 2px rgba(124,58,237,.35), var(--neu-tile); }
    .conv-item:active { transform: scale(.98); }

    .avatar {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; font-weight: 700; flex-shrink: 0;
      position: relative;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
    }
    .avatar.online::after {
      content: ''; position: absolute; bottom: 1px; right: 1px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--success-green); border: 2px solid var(--bg-card);
      animation: badgePop var(--motion-bounce) both;
    }

.conv-info { flex: 1; min-width: 0; }
    .conv-name { font-size: 15px; font-weight: 600; color: var(--soft-light); margin-bottom: 3px; }
    .conv-preview { font-size: 13px; color: rgba(196,181,253,.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
    .conv-time { font-size: 11px; color: rgba(196,181,253,.4); }
    .conv-badge {
      min-width: 20px; height: 20px; border-radius: 999px; background: var(--primary-purple); color: #fff;
      font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;
      padding: 0 6px;
      box-shadow: 0 4px 12px rgba(124,58,237,.45);
      animation: badgePop var(--motion-bounce) both;
    }

    /* -- Archive mode header (desktop) --------------------- */
    .sidebar-archive-bar { display: none; align-items: center; gap: 10px; min-width: 0; }
    .sidebar-archive-bar.show { display: flex; }
    /* The archive bar takes the brand's place while the archive is open. */
    .sidebar-header.archive-mode .sidebar-brand { display: none; }
    .sidebar-archive-bar .icon-btn {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-card); box-shadow: var(--neu-tile);
      color: var(--light-purple); border: 1px solid rgba(196,181,253,.16);
      cursor: pointer;
    }
    .sidebar-archive-bar .icon-btn:hover { color: var(--primary-purple); }
    .sidebar-archive-bar .icon-btn svg { width: 18px; height: 18px; }
    .sa-title { display: flex; flex-direction: column; font-size: 1.02rem; font-weight: 700; color: var(--soft-light); min-width: 0; }
    .sa-sub { font-size: 0.72rem; font-weight: 500; color: rgba(196,181,253,.55); margin-top: 1px; }
    [data-theme="light"] .sa-sub { color: rgba(91,33,182,.6); }

    /* -- App brand: "Gibee" wordmark in the top-left ----- */
    .app-brand {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-brand-mark {
      width: 34px; height: 34px;
      border-radius: 11px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      box-shadow: 0 6px 16px rgba(124,58,237,.42);
    }
    .app-brand-mark svg { width: 19px; height: 19px; fill: #fff; }
    .app-brand-name {
      font-size: 1.32rem;
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
      background: linear-gradient(135deg, #E9D5FF 0%, #C4B5FD 30%, #A855F7 62%, #7C3AED 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    [data-theme="light"] .app-brand-name { background-image: linear-gradient(135deg, #7C3AED, #5B21B6); }
    [data-theme="light"] .app-brand-mark { box-shadow: 0 6px 16px rgba(91,33,182,.32); }

    /* -- Overflow menu (three dots) ---------------------- */
    .overflow-menu {
      display: none;
      position: absolute;
      top: calc(var(--topbar-h) + 6px);
      right: 12px;
      z-index: 90;
      min-width: 216px;
      padding: 6px;
      background: var(--bg-card);
      border: 1px solid rgba(196,181,253,.16);
      border-radius: 18px;
      box-shadow: 0 22px 50px rgba(0,0,0,.55);
      animation: menuPop .18s cubic-bezier(.34,1.56,.64,1) both;
    }
    .overflow-menu.open { display: block; }
    @media (min-width: 769px) { .overflow-menu { display: none !important; } }
    @keyframes menuPop { from { opacity: 0; transform: translateY(-8px) scale(.96); } to { opacity: 1; transform: none; } }
    .overflow-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 13px;
      background: none;
      color: var(--light-purple);
      font-family: inherit;
      font-size: .88rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .overflow-row:hover, .overflow-row:focus-visible { background: rgba(124,58,237,.14); outline: none; }
    .overflow-row svg { width: 18px; height: 18px; fill: currentColor; flex-shrink: 0; }
    .overflow-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      color: #fff;
      font-size: .82rem;
      font-weight: 800;
    }
    .overflow-meta { display: flex; flex-direction: column; min-width: 0; }
    .overflow-meta strong {
      font-size: .88rem;
      font-weight: 700;
      color: var(--soft-light);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .overflow-meta small { font-size: .72rem; font-weight: 600; color: var(--light-purple); opacity: .75; }
    .overflow-sep { height: 1px; margin: 5px 8px; background: rgba(196,181,253,.14); }
    /* The call / three-dot menus carry longer labels, so give them more room. */
    #callMenu, #convMenu { min-width: 250px; }
    /* "More" opens a nested group rather than a second popover, so it stays
       clear of the screen edge on a phone. */
    .overflow-row-more { justify-content: space-between; }
    .overflow-row-more .ov-lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .ov-chev {
      width: 15px; height: 15px; flex-shrink: 0;
      opacity: .7;
      transition: transform var(--transition-fast);
    }
    .overflow-row-more[aria-expanded="true"] .ov-chev { transform: rotate(180deg); }
    .overflow-sub {
      margin: 4px 4px 2px;
      padding: 2px;
      border-radius: 13px;
      background: rgba(124,58,237,.08);
      border: 1px solid rgba(196,181,253,.12);
    }
    .overflow-sub[hidden] { display: none; }
    .overflow-sub .overflow-row { padding: 9px 10px; font-size: .84rem; }
    [data-theme="light"] .overflow-sub { background: rgba(124,58,237,.06); border-color: rgba(91,33,182,.1); }
    [data-theme="light"] .overflow-row:hover { background: rgba(124,58,237,.1); }
    [data-theme="light"] .overflow-menu { box-shadow: 0 22px 50px rgba(91,33,182,.18); border-color: rgba(91,33,182,.12); }
    [data-theme="light"] .overflow-sep { background: rgba(91,33,182,.1); }

    /* -- Archived entry: sits where "Active conversations" used to be -- */
    .list-archive-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin: 0;
      padding: 11px 14px;
      border: none;
      border-bottom: 1px solid rgba(196,181,253,.07);
      background: transparent;
      color: inherit;
      font-family: inherit;
      text-align: left;
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .list-archive-row:hover,
    .list-archive-row:focus-visible { background: rgba(196,181,253,.05); outline: none; }
    .list-archive-row:active { transform: scale(.995); }
    .list-archive-row.active { background: rgba(124,58,237,.16); }
    .la-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(124,58,237,.18);
      box-shadow: var(--neu-tile);
      color: var(--light-purple);
    }
    .la-icon svg { width: 19px; height: 19px; }
    .la-body { flex: 1; min-width: 0; }
    .la-label { display: block; font-size: 15px; font-weight: 600; color: var(--soft-light); }
    .la-sub { display: block; margin-top: 3px; font-size: 13px; color: rgba(196,181,253,.55); }
    .la-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .la-count {
      min-width: 20px; height: 20px; padding: 0 6px;
      border-radius: 999px;
      background: rgba(124,58,237,.22);
      color: var(--light-purple);
      font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .la-chevron { width: 20px; height: 20px; color: rgba(196,181,253,.4); }
    .la-chevron svg { width: 100%; height: 100%; display: block; }
    [data-theme="light"] .list-archive-row { border-bottom-color: rgba(91,33,182,.1); }
    [data-theme="light"] .list-archive-row:hover { background: rgba(124,58,237,.06); }
    [data-theme="light"] .list-archive-row.active { background: rgba(124,58,237,.12); }
    [data-theme="light"] .la-sub { color: rgba(91,33,182,.5); }
    [data-theme="light"] .la-chevron { color: rgba(91,33,182,.4); }
    [data-theme="light"] .la-count { background: rgba(124,58,237,.14); color: #5B21B6; }

    .conv-empty {
      margin: 30px 16px;
      text-align: center;
      color: rgba(196,181,253,.45);
      font-size: .82rem;
      line-height: 1.5;
    }

    /* New chat — hidden on desktop, the sidebar has its own action */
    .fab-new-chat { display: none; }


    /* -- Main Chat Area ------------------------ */
    .chat-main {
      display: flex;
      flex-direction: column;
      background: var(--bg-black);
      position: relative;
    }

/* Chat header */
    .chat-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(196,181,253,.07);
      background: var(--bg-surface);
      box-shadow: 0 6px 18px rgba(0,0,0,.28);
      flex-shrink: 0;
    }
    .chat-header .icon-btn,
    .app-topbar .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      box-shadow: var(--neu-tile);
      flex-shrink: 0;
    }
    .chat-header .avatar { width: 38px; height: 38px; font-size: .85rem; box-shadow: 0 3px 10px rgba(0,0,0,.3); }

    .chat-header-info { flex: 1; min-width: 0; }
    .chat-header-name { font-size: 16px; font-weight: 700; color: var(--soft-light); }
    .chat-header-status { font-size: 12px; color: var(--light-purple); margin-top: 2px; }
    .chat-header-status.offline { color: rgba(196,181,253,.45); }

/* Messages area */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-thumb { background: rgba(196,181,253,.1); border-radius: 2px; }

    .msg-group { display: flex; flex-direction: column; gap: 4px; animation: messagePop var(--motion-spring) both; }
    .msg-group.sent { align-items: flex-end; }
    .msg-group.received { align-items: flex-start; }

    .msg-bubble {
      max-width: 72%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      column-gap: 8px;
    }
    .msg-bubble .bubble-text { white-space: pre-wrap; }

    .msg-group.sent .msg-bubble {
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      color: #fff;
      border-bottom-right-radius: 6px;
    }

    .msg-group.received .msg-bubble {
      background: var(--bg-surface);
      color: var(--soft-light);
      border-bottom-left-radius: 6px;
      box-shadow: var(--neu-tile);
    }

    .msg-time { font-size: 10px; font-weight: 600; }
    .msg-group.sent .msg-time { color: rgba(255,255,255,.72); }
    .msg-group.received .msg-time { color: rgba(196,181,253,.5); }
    .msg-status { margin-left: 4px; color: var(--light-purple); }
    .msg-status.failed { cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

.typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 6px;
      background: var(--bg-surface);
      box-shadow: var(--neu-tile);
      animation: messagePop var(--motion-spring) both;
    }
    .typing-indicator span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary-purple);
      box-shadow: 0 0 10px rgba(124,58,237,.6);
      animation: typingWave .4s ease-in-out infinite alternate;
    }
    .typing-indicator span:nth-child(2) { animation-delay: .15s; }
    .typing-indicator span:nth-child(3) { animation-delay: .3s; }

    .system-notice {
      align-self: center;
      max-width: 78%;
      padding: 8px 12px;
      border: 1px solid rgba(196,181,253,.1);
      border-radius: 999px;
      background: rgba(30,27,75,.55);
      color: rgba(196,181,253,.65);
      font-size: .74rem;
      line-height: 1.4;
      text-align: center;
    }

.date-separator {
      align-self: center;
      text-align: center;
      font-size: 0.73rem;
      color: rgba(196,181,253,.45);
      padding: 2px 12px;
      background: var(--bg-surface);
      border-radius: 999px;
      box-shadow: var(--neu-tile);
    }

    /* Input area */
    .chat-input-area {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(196,181,253,.07);
      background: var(--bg-surface);
      box-shadow: 0 -6px 18px rgba(0,0,0,.28);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      position: relative;
    }

    .reply-preview {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 24px;
      background: rgba(30,27,75,.75);
      border-top: 1px solid rgba(196,181,253,.08);
      color: var(--light-purple);
      font-size: .8rem;
    }
    .reply-preview.active { display: flex; animation: pageFade var(--motion-smooth) both; }
    .reply-preview strong { display: block; color: var(--soft-light); font-size: .78rem; margin-bottom: 2px; }
    .reply-preview button { background: none; border: none; color: var(--light-purple); cursor: pointer; font-size: 1.1rem; }

    .floating-picker {
      position: absolute;
      bottom: 72px;
      left: 24px;
      display: none;
      width: min(280px, calc(100vw - 48px));
      background: var(--bg-card);
      border: 1px solid rgba(196,181,253,.16);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,.55);
      padding: 10px;
      z-index: 20;
    }
    .floating-picker.open { display: grid; gap: 8px; animation: pageFade var(--motion-smooth) both; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .picker-option {
      height: 42px;
      border-radius: 8px;
      border: 1px solid rgba(196,181,253,.12);
      background: var(--overlay);
      color: var(--soft-light);
      cursor: pointer;
      font: inherit;
      font-size: .8rem;
    }
    .picker-option:hover { border-color: var(--primary-purple); }

.msg-input-wrap {
      flex: 1;
      background: var(--bg-surface);
      border: none;
      border-radius: 999px;
      display: flex;
      align-items: center;
      padding: 6px 8px 6px 10px;
      gap: 8px;
      box-shadow: var(--neu-inset);
      transition: box-shadow 0.18s;
      min-width: 0;
    }
    .msg-input-wrap:focus-within { box-shadow: var(--neu-inset), 0 0 0 2px rgba(124,58,237,.3); }

    .msg-input {
      flex: 1;
      background: none;
      border: none;
      color: var(--soft-light);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      resize: none;
      max-height: 96px;
      line-height: 1.5;
      min-width: 0;
    }
    .msg-input::placeholder { color: rgba(196,181,253,.4); }

    .attach-btn {
      background: none; border: none; color: var(--light-purple);
      cursor: pointer; display: flex; align-items: center; padding: 1px;
      border-radius: 50%; flex-shrink: 0;
      transition: color 0.18s, transform var(--motion-smooth);
    }
    .attach-btn:hover { color: var(--primary-purple); transform: scale(1.08); }
    .attach-btn:active { transform: scale(.94); }
    .attach-btn svg { width: 21px; height: 21px; }

    .send-btn {
      width: 46px; height: 46px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      border: none; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(124,58,237,.45);
      transition: transform var(--motion-smooth), box-shadow var(--motion-smooth);
      box-shadow: 0 4px 12px rgba(124,58,237,.4);
      flex-shrink: 0;
      animation: glowPulse 2.8s ease-in-out infinite;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 6px 16px rgba(124,58,237,.55); }
    .send-btn:active { transform: scale(.97); }
    .send-btn svg { width: 20px; height: 20px; fill: #fff; transition: transform var(--motion-smooth); }
    .send-btn:hover svg { transform: rotate(-12deg) translateX(1px); }
    .send-btn.recording { background: linear-gradient(135deg, #DC2626, #7C2D12); }

    /* Logout banner */
    .logout-btn {
      position: absolute; top: 16px; right: 24px;
      background: transparent; border: 1px solid rgba(196,181,253,.18);
      border-radius: 8px; color: rgba(196,181,253,.6);
      font-size: 0.75rem; font-weight: 600; cursor: pointer;
      padding: 6px 12px; font-family: inherit;
      transition: all 0.18s;
    }
    .logout-btn:hover { background: rgba(248,113,113,.1); border-color: var(--error-red); color: var(--error-red); }

    /* Welcome overlay when no chat selected */
    .welcome-overlay {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: rgba(196,181,253,.35);
    }
    .welcome-overlay svg { width: 64px; height: 64px; fill: rgba(124,58,237,.25); }
    .welcome-overlay h2 { font-size: 1.3rem; color: rgba(196,181,253,.5); font-weight: 700; }
    .welcome-overlay p { font-size: 0.85rem; }

.details-drawer {
      background: var(--bg-card);
      border-left: 1px solid rgba(196,181,253,.1);
      box-shadow: var(--neu-shadow);
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .drawer-empty {
      margin: auto 0;
      color: rgba(196,181,253,.35);
      font-size: .82rem;
      text-align: center;
      line-height: 1.5;
    }

    .drawer-profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(196,181,253,.08);
    }

    .drawer-name { color: var(--soft-light); font-weight: 800; }
    .drawer-meta { color: rgba(196,181,253,.5); font-size: .76rem; margin-top: 3px; }
    .drawer-section h3 {
      color: var(--light-purple);
      font-size: .76rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .media-tile {
      aspect-ratio: 1;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(124,58,237,.25), rgba(52,211,153,.16));
      border: 1px solid rgba(196,181,253,.1);
      animation: pageFade var(--motion-smooth) both;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: rgba(196,181,253,.62);
      font-size: .8rem;
      padding: 8px 0;
      border-bottom: 1px solid rgba(196,181,253,.06);
    }
    .info-row strong { color: var(--soft-light); font-weight: 700; }

    .drawer-profile-btn {
      width: 100%;
      margin-top: 4px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(196,181,253,.18);
      background: var(--overlay);
      color: var(--light-purple);
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--motion-smooth), color var(--motion-smooth), border-color var(--motion-smooth);
    }
    .drawer-profile-btn:hover { background: var(--primary-purple); border-color: var(--primary-purple); color: #fff; }

    .media-tile { cursor: pointer; transition: transform var(--motion-smooth), box-shadow var(--motion-smooth); }
    .media-tile:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 8px 20px rgba(124,58,237,.3); }

.settings-panel {
      position: fixed;
      top: 86px;
      left: 86px;
      width: 260px;
      z-index: 80;
      display: none;
      background: var(--bg-surface);
      border: 1px solid rgba(196,181,253,.16);
      border-radius: 18px;
      box-shadow: var(--neu-shadow);
      padding: 14px;
      animation: pageFade var(--motion-smooth) both;
    }
    .settings-panel.open { display: block; }
    .settings-title {
      color: var(--soft-light);
      font-size: .86rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      color: var(--light-purple);
      font-size: .82rem;
    }
    .theme-switch {
      position: relative;
      width: 48px;
      height: 26px;
      flex: 0 0 auto;
    }
    .theme-switch input { opacity: 0; width: 0; height: 0; }
    .theme-switch span {
      position: absolute;
      inset: 0;
      cursor: pointer;
      border-radius: 999px;
      background: var(--overlay);
      border: 1px solid rgba(196,181,253,.2);
      transition: background var(--motion-smooth), border-color var(--motion-smooth);
    }
    .theme-switch span::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: var(--light-purple);
      transition: transform var(--motion-spring), background var(--motion-smooth);
    }
    .theme-switch input:checked + span {
      background: var(--primary-purple);
      border-color: var(--primary-purple);
    }
    .theme-switch input:checked + span::before {
      transform: translateX(22px);
      background: #fff;
    }

    .quick-send-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 70;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      color: #fff;
      background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(124,58,237,.42);
      transition: transform var(--motion-smooth), box-shadow var(--motion-smooth);
      animation: glowPulse 2.8s ease-in-out infinite;
    }
    .quick-send-btn:hover { transform: scale(1.08); box-shadow: 0 10px 28px rgba(124,58,237,.58); }
    .quick-send-btn:active { transform: scale(.96); }
    .quick-send-btn svg { width: 20px; height: 20px; fill: currentColor; transition: transform var(--motion-smooth); }
    .quick-send-btn:hover svg { transform: rotate(-12deg) translateX(1px); }

    [data-theme="light"] body,
    [data-theme="light"] .chat-shell,
    [data-theme="light"] .chat-main {
      background: var(--bg-black);
    }
[data-theme="light"] .nav-rail,
    [data-theme="light"] .sidebar,
    [data-theme="light"] .details-drawer,
    [data-theme="light"] .settings-panel {
      background: var(--bg-surface);
      border-color: rgba(91,33,182,.14);
      box-shadow: var(--neu-shadow);
    }
    [data-theme="light"] .chat-header,
    [data-theme="light"] .chat-input-area {
      background: rgba(255,255,255,.82);
      border-color: rgba(91,33,182,.12);
    }
[data-theme="light"] .conv-item:hover,
    [data-theme="light"] .conv-item:focus-visible {
      background: var(--overlay);
    }
    [data-theme="light"] .conv-item.active {
      background: rgba(124,58,237,.12);
    }
    [data-theme="light"] .conv-preview,
    [data-theme="light"] .conv-time,
    [data-theme="light"] .msg-time,
    [data-theme="light"] .drawer-meta,
    [data-theme="light"] .info-row,
    [data-theme="light"] .settings-row {
      color: rgba(91,33,182,.62);
    }
    [data-theme="light"] .date-separator,
    [data-theme="light"] .welcome-overlay,
    [data-theme="light"] .drawer-empty {
      color: rgba(91,33,182,.42);
    }
[data-theme="light"] .msg-group.received .msg-bubble,
    [data-theme="light"] .typing-indicator,
    [data-theme="light"] .msg-input-wrap,
    [data-theme="light"] .date-separator,
    [data-theme="light"] .floating-picker,
    [data-theme="light"] .picker-option {
      background: #FFFFFF;
      border-color: rgba(91,33,182,.14);
      color: var(--soft-light);
    }
    [data-theme="light"] .system-notice,

      background: rgba(237,233,254,.78);
      border-color: rgba(91,33,182,.12);
      color: rgba(91,33,182,.72);
    }
    [data-theme="light"] .drawer-profile,
    [data-theme="light"] .info-row {
      border-color: rgba(91,33,182,.1);
      background-color: rgba(237,233,254,.78);
    }
    [data-theme="light"] .drawer-profile {

    }
    [data-theme="light"] .icon-btn {
      background: #FFFFFF;

    }
    [data-theme="light"] .icon-btn:hover,
    [data-theme="light"] .icon-btn:focus-visible {
      background: var(--primary-purple);
      border-color: var(--primary-purple);
      color: #FFFFFF;
      box-shadow: 0 8px 18px rgba(109,40,217,.24);
    }
    [data-theme="light"] .icon-btn:active {
      background: var(--mid-purple);
      color: #FFFFFF;
    }
    [data-theme="light"] .attach-btn {

    }
    [data-theme="light"] .attach-btn:hover,

    [data-theme="light"] .picker-option:hover,

    [data-theme="light"] .logout-btn {
      border-color: rgba(91,33,182,.18);
      color: rgba(91,33,182,.68);
    }

    /* -- Responsive: fit all devices ----------------------- */

    /* Small laptops — drop the details drawer */
    @media (max-width: 1280px) {
      .chat-shell { grid-template-columns: 72px 300px minmax(0, 1fr); }
      .details-drawer { display: none; }
    }

    /* Tablets — tighter columns */
    @media (max-width: 1024px) {
      .chat-shell { grid-template-columns: 64px 280px minmax(0, 1fr); }
      .nav-rail { padding: 14px 8px; gap: 12px; }
      .rail-logo, .rail-profile { width: 38px; height: 38px; }
    }

    /* Phones & small tablets — the conversation list is the home screen,
       exactly like WhatsApp: list first, conversation slides in on top. */
    @media (max-width: 768px) {
      .chat-shell {
        display: block;
        position: relative;
        overflow: hidden;
      }

      .nav-rail { display: none; }
      .details-drawer { display: none; }

      /* -- Screen 1: conversation list -------------------- */
      .sidebar {
        position: absolute;
        inset: 0;
        width: 100%;
        z-index: 1;
        transform: translateX(0);
        border-right: none;
        border-radius: 0;
        background: var(--bg-black);
        transition: transform var(--motion-spring), opacity var(--motion-smooth);
      }

      /* the app top bar carries the brand + actions, so drop the duplicate */
      .sidebar-header { display: none; }
    .sidebar-search { padding: 6px 14px 10px; }
    .sidebar-search input { height: 52px; border-radius: 16px; font-size: 1rem; }
    .archive-note { margin: 0 14px 2px; padding: 9px 12px; font-size: .72rem; gap: 8px; }
    .archive-note svg { width: 14px; height: 14px; }
      .sidebar-tabs { padding: 0 14px 10px; }
      .sidebar-tabs-scroll { gap: 6px; }
      .s-tab { padding: 9px 10px; font-size: 0.88rem; }
      .s-tab-add { width: 37px; height: 37px; }      .conv-list { padding: 0 0 96px; -webkit-overflow-scrolling: touch; }

      /* Conversation rows are a fixed height so the first screen shows a
         whole, even number of chats before the list scrolls. */
      .conv-item {
        margin: 0;
        height: 86px;
        padding: 0 16px;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        border-bottom: 1px solid rgba(196,181,253,.07);
      }
      .conv-item:hover, .conv-item:focus-visible { background: rgba(196,181,253,.05); transform: none; box-shadow: none; }
      .conv-item.active { background: rgba(124,58,237,.16); box-shadow: inset 3px 0 0 var(--primary-purple); }
      .conv-item:active { transform: scale(.995); }
      .conv-item { gap: 14px; }
      .conv-item .avatar { width: 56px; height: 56px; font-size: 1.15rem; }
      .conv-item .avatar.online::after { width: 13px; height: 13px; border-width: 2.5px; }
      .conv-item .conv-name { font-size: 17px; margin-bottom: 4px; }
      .conv-item .conv-preview { font-size: 14px; }
      .conv-item .conv-time { font-size: 12.5px; }
      .conv-item .conv-badge { min-width: 24px; height: 24px; font-size: 12.5px; padding: 0 7px; }
      .conv-item .conv-meta { gap: 7px; }

      /* The archive row is a secondary link, so it stays a slim band above
         the conversations rather than a full-height row. */
      .list-archive-row { padding: 3px 16px; gap: 11px; }
      .list-archive-row .la-icon { width: 28px; height: 28px; }
      .list-archive-row .la-icon svg { width: 15px; height: 15px; }
      .list-archive-row .la-label { font-size: 14.5px; }
      .list-archive-row .la-sub { margin-top: 1px; font-size: 11px; }
      .list-archive-row .la-count { min-width: 20px; height: 20px; font-size: 11.5px; }
      .list-archive-row .la-chevron { width: 16px; height: 16px; }

      /* -- Screen 2: the conversation --------------------- */
      .chat-main {
        position: absolute;
        inset: 0;
        z-index: 2;
        transform: translateX(100%);
        background: var(--bg-black);
        transition: transform var(--motion-spring);
        will-change: transform;
      }
      .chat-shell.m-view-chat .chat-main { transform: translateX(0); }
      .chat-shell.m-view-chat .sidebar { transform: translateX(-24%); opacity: .5; }

      /* Inside a conversation the chat owns the whole screen */
      .chat-shell.m-view-chat ~ .bottom-nav { display: none; }

      .app-topbar { display: flex; }
      .bottom-nav { display: flex; }

      .chat-header { display: none; }
      .chat-main-body { margin-top: 0; }
      .welcome-overlay, .logout-btn { display: none; }

      /* Neumorphic mobile top bar (spec: 36px avatar / 40px + button) */
      .app-topbar { background: var(--bg-surface); box-shadow: 0 6px 16px rgba(0,0,0,.28); min-height: 72px; padding: 0 14px; }
      .app-topbar .icon-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--bg-card); box-shadow: var(--neu-tile); flex-shrink: 0; }
      .app-topbar .icon-btn svg { width: 20px; height: 20px; }
      .app-topbar.in-conv .icon-btn { color: var(--light-purple); }
      .app-topbar-title { flex: 1; min-width: 0; font-size: 1.32rem; }
      .app-topbar .app-brand { gap: 12px; }
      .app-topbar .app-brand-mark { width: 40px; height: 40px; border-radius: 13px; }
      .app-topbar .app-brand-mark svg { width: 21px; height: 21px; }
      .app-topbar .app-brand-name { font-size: 1.32rem; }
      .app-topbar .chat-header-profile {
        flex: 1; min-width: 0;
        display: flex; align-items: center; gap: 13px;
        background: none; border: none; cursor: pointer;
        text-align: left; padding: 0; font-family: inherit;
        color: inherit;
      }
      .app-topbar .chat-header-profile .avatar { width: 44px; height: 44px; border-radius: 50%; font-size: 1rem; }
      .app-topbar .chat-header-profile .chat-header-info { min-width: 0; }
      .app-topbar .chat-header-profile .chat-header-name {
        font-size: 18px; font-weight: 700; color: var(--soft-light);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .app-topbar .chat-header-profile .chat-header-status { font-size: 13px; }
      .fab-call {
        width: 44px; height: 44px; border-radius: 50%;
        border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        background: var(--bg-card); color: var(--primary-purple); box-shadow: var(--neu-tile);
        transition: transform var(--motion-smooth), box-shadow var(--motion-smooth);
      }
      .fab-call svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
      .fab-call:active { transform: scale(.92); }
      /* Phone + its drop-down arrow read as one control, so they sit tight. */
      .call-cluster { display: flex; align-items: center; flex-shrink: 0; gap: 2px; }
      .app-topbar .fab-call-chev { width: 30px; height: 44px; }
      .app-topbar .fab-call-chev svg { width: 15px; height: 15px; }

      /* New chat — floats just above the tab bar, bottom right */
      .fab-new-chat {
        position: absolute;
        right: 18px;
        bottom: 18px;
        z-index: 30;
        width: 60px; height: 60px;
        border-radius: 50%;
        border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: #fff;
        background: linear-gradient(135deg, var(--primary-purple), var(--mid-purple));
        box-shadow: 0 10px 26px rgba(124,58,237,.5);
        transition: transform var(--motion-spring), opacity var(--motion-smooth);
      }
      .fab-new-chat svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .fab-new-chat:active { transform: scale(.9); }
      .chat-shell.m-view-chat .fab-new-chat { opacity: 0; pointer-events: none; transform: scale(.6); }
      [data-theme="light"] .fab-new-chat { box-shadow: 0 10px 24px rgba(91,33,182,.3); }

      .messages-area { padding: 16px 14px; gap: 18px; }
      .msg-bubble { max-width: 82%; font-size: 15.5px; line-height: 1.55; padding: 11px 15px; border-radius: 20px; }
      .msg-time { font-size: 11.5px; }
      .date-separator { font-size: 0.8rem; }
      .chat-input-area { padding: 10px 12px; gap: 10px; }
      .chat-input-area .msg-input { font-size: 16px; }
      .chat-input-area .attach-btn svg { width: 24px; height: 24px; }
      /* no tab bar in here, so the chat owns the home-indicator inset */
      /* Breathing room under the composer, plus whatever the on-screen keyboard
         covers. The app frame is 100dvh, which already shrinks on Android but
         not on iOS, so --kb-inset makes up the difference there. */
      .chat-shell.m-view-chat .chat-input-area {
        padding-bottom: calc(16px + env(safe-area-inset-bottom) + var(--kb-inset, 0px));
      }
      .floating-picker { left: 12px; right: 12px; bottom: 84px; width: auto; }
      .reply-preview { padding: 10px 14px; }

      [data-theme="light"] .conv-item { border-bottom-color: rgba(91,33,182,.1); }
      [data-theme="light"] .conv-item:hover,
      [data-theme="light"] .conv-item:focus-visible { background: rgba(124,58,237,.06); }
      [data-theme="light"] .conv-item.active { background: rgba(124,58,237,.12); }

      /* Settings drops from the top bar, so the theme switch sits high
         on screen instead of floating over the middle of the list. */
      .settings-panel {
        left: 12px; right: 12px; width: auto;
        top: calc(var(--topbar-h) + 6px);
        bottom: auto;
        border-radius: 20px;
        animation: settingsDrop 180ms cubic-bezier(.25,.1,.25,1) both;
      }
      @keyframes settingsDrop {
        from { opacity: 0; transform: translateY(-12px); }
        to { opacity: 1; transform: none; }
      }
      .quick-send-btn { display: none; }
    }

    @media (max-width: 380px) {
      .msg-bubble { max-width: 88%; }
      .chat-header .icon-btn { width: 32px; height: 32px; }
      .send-btn { width: 42px; height: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>

  const localQueue = {
    KEY: 'chat_pending_messages',
    all() {
      try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e) { return []; }
    },
    save(items) {
      localStorage.setItem(this.KEY, JSON.stringify(items));
    },
    add(message) {
      const next = this.all().filter(item => item.tempId !== message.tempId);
      next.push(message);
      this.save(next);
    },
    remove(tempId) {
      this.save(this.all().filter(item => item.tempId !== tempId));
    }
  };

  const socketHub = {
    connected: navigator.onLine,
    backoff: 1000,
    listeners: {},
    on(event, handler) {
      this.listeners[event] = this.listeners[event] || [];
      this.listeners[event].push(handler);
    },
    emitLocal(event, payload) {
      (this.listeners[event] || []).forEach(handler => handler(payload));
    },
    send(event, payload) {
      if (!this.connected) throw new Error('offline');
      if (event === 'message:send') {
        setTimeout(() => {
          this.emitLocal('message:ack', {
            tempId: payload.tempId,
            messageId: 'msg_' + Date.now(),
            status: 'sent'
          });
        }, 650);
      }
    },
    reconnect() {
      this.connected = navigator.onLine;
      this.emitLocal('presence:update', {
        userId: 'system',
        status: this.connected ? 'online' : 'offline',
        lastSeen: Date.now()
      });
      if (!this.connected) {
        this.backoff = Math.min(this.backoff * 2, 30000);
        setTimeout(() => this.reconnect(), this.backoff);
      } else {
        this.backoff = 1000;
        flushPendingMessages();
      }
    }
  };

  }
  window.addEventListener('resize', syncTopbarHeight);

  // scrolls the page when the keyboard opens.
  let kbInset = 0;
  function syncKeyboardInset() {
    const vv = window.visualViewport;
    if (!vv) return;
    const covered = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    if (covered === kbInset) return;
    kbInset = covered;
    document.documentElement.style.setProperty('--kb-inset', covered + 'px');

    visualViewport.addEventListener('resize', syncKeyboardInset);
    visualViewport.addEventListener('scroll', syncKeyboardInset);
  }

  // reliable resize, so re-measure once the new layout settles.
  window.addEventListener('orientationchange', () => setTimeout(syncKeyboardInset, 300));

    if (!isMobile()) { applyView(view); return; }

    applyView(view);

          type: 'text'
        });
      } catch(e) {
        message.status = 'failed';
        localQueue.add({ chatId: id, ...message });
        updateMessageStatus(tempId, 'failed');
        showToast('You are offline. Message queued for retry.', 'info');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  }

  function appendMessage(message) {
    const area = document.getElementById('messagesArea');
    const bottom = document.getElementById('msgBottom');
    if (!area || !bottom) return;
    const div = document.createElement('div');
    div.className = 'msg-group sent';
    div.dataset.tempId = message.tempId || message.id;
    div.innerHTML = `<div class="msg-bubble"><span class="bubble-text">${escapeHtml(message.text)}</span><span class="msg-time">${escapeHtml(message.time)}<span class="msg-status${statusClass(message.status)}">${statusMark(message.status)}</span></span></div>`;
    area.insertBefore(div, bottom);
    bottom.scrollIntoView({ behavior: 'smooth' });
  }

  function updateMessageStatus(tempId, status) {
    Object.values(msgs).forEach(list => {
      const found = list.find(item => item.tempId === tempId);
      if (found) found.status = status;
    });
    const row = document.querySelector(`[data-temp-id="${tempId}"] .msg-status`);
    if (row) {
      row.textContent = statusMark(status);
      row.classList.toggle('failed', status === 'failed');
      row.animate(
        [{ transform: 'scale(.88)', opacity: .65 }, { transform: 'scale(1.08)', opacity: 1 }, { transform: 'scale(1)', opacity: 1 }],
        { duration: 320, easing: 'cubic-bezier(.22,1.45,.36,1)' }
      );
    }
    if (status === 'sent') localQueue.remove(tempId);
  }

  function retryPendingMessage(tempId) {
    const message = localQueue.all().find(item => item.tempId === tempId);
    if (!message) return;
    try {
      updateMessageStatus(tempId, 'sending');
      socketHub.send('message:send', {
        tempId,
        chatId: 'c_' + message.chatId,
        content: message.text,
        type: 'text'
      });
    } catch(e) {
      updateMessageStatus(tempId, 'failed');
      showToast('Still offline. Message remains queued.', 'info');
    }
  }

  function flushPendingMessages() {
    localQueue.all().forEach(message => {
      try {
        updateMessageStatus(message.tempId, 'sending');
        socketHub.send('message:send', {
          tempId: message.tempId,
          chatId: 'c_' + message.chatId,
          content: message.text,
          type: 'text'
        });
      } catch(e) {
        updateMessageStatus(message.tempId, 'failed');
      }
    });
  }

  socketHub.on('message:ack', payload => {
    updateMessageStatus(payload.tempId, payload.status);
  });

  document.addEventListener('click', event => {
    if (!event.target.classList.contains('msg-status')) return;
    if (!event.target.textContent.includes('Failed')) return;
    const row = event.target.closest('[data-temp-id]');
    if (row) retryPendingMessage(row.dataset.tempId);
  });

  function renderDetailsDrawer(conv) {
    const drawer = document.getElementById('detailsDrawer');
    drawer.innerHTML = `
      <div class="drawer-profile">
        <div class="avatar${conv.online ? ' online' : ''}" style="background:${conv.color}22;color:${conv.color};border:1.5px solid ${conv.color}55">${escapeHtml(conv.initials)}</div>
        <div>
          <div class="drawer-name">${escapeHtml(conv.name)}</div>
          <div class="drawer-meta">${conv.members} member${conv.members === 1 ? '' : 's'} · ${conv.online ? 'online' : 'last seen recently'}</div>
        </div>
      </div>
      <div class="drawer-section">
        <h3>Shared Media</h3>
        <div class="media-grid"><span class="media-tile" data-media></span><span class="media-tile" data-media></span><span class="media-tile" data-media></span></div>
      </div>
      <div class="drawer-section">
        <h3>Encryption</h3>
        <div class="info-row"><span>Session</span><strong>E2EE ready</strong></div>
        <div class="info-row"><span>Local queue</span><strong>${localQueue.all().length}</strong></div>
        <div class="info-row"><span>Transport</span><strong>${socketHub.connected ? 'Connected' : 'Offline'}</strong></div>
      </div>
      <button class="drawer-profile-btn" type="button" data-open-profile>View full profile &amp; media &rarr;</button>
    `;

    drawer.querySelector('[data-open-profile]')?.addEventListener('click', () => openProfilePage(conv.id));
    drawer.querySelectorAll('[data-media]').forEach(tile => {
      tile.addEventListener('click', () => openProfilePage(conv.id, 'media'));
    });
  }

  // -- Init ----------------------------------------------
  const overflowNameEl = document.getElementById('overflowName');
  const overflowAvatarEl = document.getElementById('overflowAvatar');
  if (overflowNameEl) overflowNameEl.textContent = user.name || 'You';
  if (overflowAvatarEl) overflowAvatarEl.textContent = userInitials();

  function syncArchiveButton() {
    const btn = document.getElementById('archiveBtn');
    if (!btn) return;
    btn.classList.toggle('active', activeView === 'archive');
  }

  applyView('list', { fromHistory: true });
  setActiveNav('chats');
  syncArchiveButton();

  // "New chat" app shortcut
  if (new URLSearchParams(location.search).has('new')) {
    history.replaceState(null, '', location.pathname);
    showToast('New chat — search for someone to message.', 'info', 2600);
    document.getElementById('sidebarSearch')?.focus();
  }

  // -- Logout ---------------------------------------------
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    Session.clear();
    localStorage.removeItem('chat_remember');
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
